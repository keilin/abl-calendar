name: Build and publish ABL calendar

on:
  push:
    branches: [main]
    paths:
      - "events.csv"
      - "scripts/**"
      - "index.html"
      - "logo.jpg"
      - "site/**"
      - ".github/workflows/publish-calendar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate calendar feed and event data
        run: python scripts/build_calendar.py

      - name: Prepare Pages artifact
        run: |
          cp index.html site/index.html
          if [ -f logo.jpg ]; then cp logo.jpg site/logo.jpg; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
